<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Simulador POCUS - Orientación Espacial</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        body { font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; touch-action: none; }
        .sim-container { background-color: #1a202c; }
        
        /* --- EL TRANSDUCTOR --- */
        #probe {
            width: 50px;
            height: 80px;
            position: absolute;
            top: 50%;
            left: 20px;
            transform: translate(-50%, -50%);
            cursor: grab;
            z-index: 50;
            transition: transform 0.2s cubic-bezier(0.4, 0, 0.2, 1);
            filter: drop-shadow(0 10px 8px rgba(0,0,0,0.6));
        }
        #probe:active { cursor: grabbing; transform: translate(-50%, -50%) scale(0.95); }
        #probe.transversal { transform: translate(-50%, -50%) rotate(-90deg); }
        #probe.transversal:active { transform: translate(-50%, -50%) rotate(-90deg) scale(0.95); }

        /* --- ZONAS CALIENTES --- */
        .hotspot {
            position: absolute;
            border: 2px dashed rgba(255, 255, 255, 0.4);
            border-radius: 8px;
            transition: all 0.2s;
            display: flex;
            align-items: center;
            justify-content: center;
        }
        .hotspot.active {
            background-color: rgba(72, 187, 120, 0.5);
            border-color: #48bb78;
            border-width: 3px;
            box-shadow: 0 0 15px rgba(72, 187, 120, 0.5);
        }
        .hotspot span { font-size: 0.6rem; color: white; font-weight: bold; text-align: center; text-shadow: 1px 1px 2px black; }

        .static-noise {
            background-image: repeating-radial-gradient(circle at 17% 32%, #222, #050505 0.00085px);
            animation: noise 0.5s infinite alternate;
        }
        @keyframes noise { 0% { background-position: 0 0; } 100% { background-position: 10px 10px; } }

        /* SVG Scaling fixes */
        .svg-content { width: 100%; height: 100%; object-fit: contain; }
        .svg-anat-container { transition: transform 0.6s cubic-bezier(0.4, 0, 0.2, 1); }
        .rotate-long { transform: rotate(-90deg) scale(0.85); }
        .rotate-trans { transform: rotate(90deg) scale(0.85); }
        .echo-overlay { transition: opacity 0.3s ease; }
        .patho-fluid { transition: opacity 0.5s ease; }
        .shift-organ { transition: transform 0.5s ease; }
    </style>
</head>
<body class="bg-gray-900 text-gray-100 h-screen w-screen overflow-hidden flex flex-col">

    <!-- LIBRERÍA DE SVGs -->
    <svg style="display:none;">
        <defs>
            <g id="detailed-probe">
                <path d="M25 65 C25 80, 15 90, 25 105" stroke="#475569" stroke-width="6" fill="none" stroke-linecap="round"/>
                <rect x="15" y="45" width="20" height="25" rx="4" fill="#334155"/>
                <rect x="12" y="15" width="26" height="35" rx="6" fill="#94a3b8"/>
                <line x1="16" y1="20" x2="16" y2="45" stroke="#64748b" stroke-width="2" stroke-linecap="round"/>
                <line x1="34" y1="20" x2="34" y2="45" stroke="#64748b" stroke-width="2" stroke-linecap="round"/>
                <path d="M5 20 Q25 -10 45 20 L38 25 L12 25 Z" fill="#1e293b"/>
                <circle cx="6" cy="12" r="6" fill="#60a5fa" stroke="#fff" stroke-width="1.5">
                    <animate attributeName="r" values="5;7;5" dur="1.5s" repeatCount="indefinite" />
                </circle>
            </g>
        </defs>
    </svg>

    <!-- Header y Controles -->
    <header class="bg-gray-800 px-4 py-2 shadow-md flex flex-wrap justify-between items-center z-20 border-b border-gray-700 flex-shrink-0">
        <div class="flex items-center gap-4">
            <h1 class="text-xl font-bold text-blue-400">Simulador POCUS</h1>
            <div class="flex gap-2">
                <button onclick="setProtocol('efast')" id="btn-efast" class="bg-blue-600 text-white px-3 py-1 rounded border border-blue-500 font-semibold text-sm">e-FAST</button>
                <button onclick="setProtocol('rush')" id="btn-rush" class="bg-transparent text-gray-300 px-3 py-1 rounded border border-gray-600 font-semibold text-sm">RUSH</button>
            </div>
        </div>

        <div class="flex items-center gap-4 bg-gray-900 p-1.5 rounded-lg border border-gray-700">
            <button id="pathology-btn" class="bg-red-900/80 hover:bg-red-700 text-red-200 border border-red-500 px-3 py-1.5 rounded font-bold transition flex items-center gap-2 text-sm hidden">
                <svg class="w-4 h-4" fill="currentColor" viewBox="0 0 20 20"><path fill-rule="evenodd" d="M10 18a8 8 0 100-16 8 8 0 000 16zM8.707 7.293a1 1 0 00-1.414 1.414L8.586 10l-1.293 1.293a1 1 0 101.414 1.414L10 11.414l1.293 1.293a1 1 0 001.414-1.414L11.414 10l1.293-1.293a1 1 0 00-1.414-1.414L10 8.586 8.707 7.293z" clip-rule="evenodd"></path></svg>
                <span>Sangrado (FAST +)</span>
            </button>
            <button id="rotate-btn" class="bg-indigo-600 hover:bg-indigo-500 text-white px-4 py-1.5 rounded font-bold transition flex items-center gap-2 text-sm">
                <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 4v5h.582m15.356 2A8.001 8.001 0 004.582 9m0 0H9m11 11v-5h-.581m0 0a8.003 8.003 0 01-15.357-2m15.357 2H15"></path></svg>
                Rotar (R)
            </button>
            <div class="text-right border-l border-gray-700 pl-3">
                <div class="text-[10px] text-gray-400 uppercase">Marca Azul apunta:</div>
                <div id="orientation-status" class="font-black text-base text-blue-400">HACIA CABEZA</div>
            </div>
        </div>
    </header>

    <!-- Contenedor Principal (Grid responsive estricto) -->
    <main class="flex-1 grid grid-cols-1 md:grid-cols-3 gap-1 p-1 bg-black min-h-0 overflow-hidden">
        
        <!-- PANEL 1: MAPA PACIENTE -->

                    <path d="M40 70 C40 50, 160 50, 160 70 L170 250 C170 350, 140 380, 100 380 C60 380, 30 350, 30 250 Z" fill="#cbd5e1" stroke="#64748b" stroke-width="2"/>
                    <path d="M40 70 L10 150 L25 150 L45 90" fill="#94a3b8"/>
                    <path d="M160 70 L190 150 L175 150 L155 90" fill="#94a3b8"/>
                    <circle cx="100" cy="260" r="3" fill="#64748b"/>
                    <path d="M100 70 L100 150" stroke="#94a3b8" stroke-dasharray="2"/>
                    <path d="M50 160 Q100 120 150 160" fill="none" stroke="#64748b" stroke-width="2" stroke-dasharray="4"/>
                </svg>

                <div class="hotspot bg-red-500/20 border-red-400 protocol-efast protocol-rush" data-zone="morison" style="top: 55%; left: 15%; width: 25%; height: 12%;"><span>FLANCO<br>DER.</span></div>
                <div class="hotspot bg-yellow-500/20 border-yellow-400 protocol-efast protocol-rush" data-zone="periesplenico" style="top: 55%; left: 60%; width: 25%; height: 12%;"><span>FLANCO<br>IZQ.</span></div>
                <div class="hotspot bg-purple-500/20 border-purple-400 protocol-efast protocol-rush" data-zone="pelvico" style="top: 75%; left: 35%; width: 30%; height: 12%;"><span>PÉLVICA</span></div>
                
                <div id="probe">
                    <svg viewBox="0 0 50 105" class="w-full h-full"><use href="#detailed-probe" /></svg>
                </div>
            </div>
        </div>

        <!-- PANEL 2: PANTALLA ECO -->

                </div>

            </div>

                </div>

                <!-- ================= VISTAS MORISON ================= -->

                        <text x="96" y="6" font-size="3" fill="#9ca3af" text-anchor="end">PIES (Inf.)</text>
                        
                        <path d="M30 0 L70 0 L100 100 L0 100 Z" fill="#111" />
                        <!-- Diafragma -->
                        <path d="M10 30 Q30 20 60 40" stroke="#fff" stroke-width="3" fill="none" filter="blur(1px)"/>
                        <!-- Hígado -->
                        <path d="M15 35 Q40 25 70 50 Q75 80 40 85 Q15 70 15 35" fill="#333" filter="blur(2px)"/>
                        <!-- Morison -->

                            <ellipse cx="65" cy="70" rx="10" ry="5" fill="#555" filter="blur(2px)"/>
                        </g>

                        <g class="echo-overlay hidden">
                            <path d="M15 35 Q40 25 70 50 Q75 80 40 85 Q15 70 15 35" fill="rgba(239, 68, 68, 0.3)" />
                            <text x="35" y="55" font-size="4" fill="#fca5a5" font-weight="bold">Hígado</text>
                            <g class="shift-organ" data-shift="rotate(-20 65 70) translate(5, 8)" data-normal="rotate(-20 65 70)">
                                <ellipse cx="65" cy="70" rx="20" ry="15" fill="rgba(59, 130, 246, 0.3)"/>
                                <text x="-5" y="5" font-size="4" fill="#93c5fd" font-weight="bold">Riñón</text>
                            </g>
                            <path d="M10 30 Q30 20 60 40" stroke="rgba(234, 179, 8, 0.6)" stroke-width="3" fill="none"/>
                            <text x="25" y="28" font-size="3" fill="#fde047" font-weight="bold">Diafragma</text>
                        </g>
                    </svg>
                </div>

                <div id="echo-morison-trans" class="absolute inset-0 hidden bg-black view-layer">
                    <svg class="svg-content" viewBox="0 0 100 100" preserveAspectRatio="xMidYMid meet">
                        <rect x="2" y="2" width="28" height="6" rx="1" fill="rgba(30,58,138,0.7)"/>
                        <text x="16" y="6.2" font-size="3.5" fill="#bfdbfe" font-weight="bold" text-anchor="middle">DER. PACIENTE</text>
                        <text x="96" y="6" font-size="3" fill="#9ca3af" text-anchor="end">IZQ. PACIENTE</text>

                        <path d="M30 0 L70 0 L100 100 L0 100 Z" fill="#111" />
                        <path d="M10 20 Q50 20 60 50 Q50 70 10 70 Z" fill="#333" filter="blur(2px)"/>
                        <circle cx="55" cy="60" r="15" fill="#222" filter="blur(1px)"/>
                        <path d="M35 85 Q50 75 65 85 L75 100 L25 100 Z" fill="#000"/> <!-- Sombra negra espinal -->
                        
                        <g class="echo-overlay hidden">
                            <path d="M10 20 Q50 20 60 50 Q50 70 10 70 Z" fill="rgba(239, 68, 68, 0.3)"/>

                            <circle cx="55" cy="60" r="15" fill="rgba(59, 130, 246, 0.3)"/>
                            <text x="49" y="61" font-size="4" fill="#93c5fd" font-weight="bold">Riñón</text>
                            <path d="M40 85 Q50 80 60 85" stroke="rgba(234, 179, 8, 0.6)" stroke-width="2" fill="none" />

                        </g>

                <!-- ================= VISTAS ESPLÉNICO ================= -->

                    <svg class="svg-content" viewBox="0 0 100 100" preserveAspectRatio="xMidYMid meet">
                        <rect x="2" y="2" width="22" height="6" rx="1" fill="rgba(30,58,138,0.7)"/>
                        <text x="13" y="6.2" font-size="3.5" fill="#bfdbfe" font-weight="bold" text-anchor="middle">CABEZA (Sup.)</text>
                        <text x="96" y="6" font-size="3" fill="#9ca3af" text-anchor="end">PIES (Inf.)</text>

                        <path d="M30 0 L70 0 L100 100 L0 100 Z" fill="#111" />
                        <path d="M10 35 Q25 25 50 40" stroke="#fff" stroke-width="3" fill="none" filter="blur(1px)"/>
                        <path d="M15 40 Q35 30 50 55 Q40 65 15 50 Z" fill="#3a3a3a" filter="blur(1px)"/>
                        <path d="M35 60 Q45 58 55 50" stroke="#9ca3af" stroke-width="1.5" fill="none" filter="blur(0.5px)"/>
                        
                        <path class="patho-fluid opacity-0" d="M30 65 Q45 55 55 45 Q65 55 40 70 Z" fill="#000" stroke="#111" stroke-width="1"/>
                        
                        <g class="shift-organ" data-shift="translate(8, 8)" data-normal="translate(0, 0)">
                            <ellipse cx="65" cy="75" rx="18" ry="14" fill="#222" transform="rotate(-10 65 75)" filter="blur(1px)"/>
                            <ellipse cx="65" cy="75" rx="8" ry="4" fill="#555" transform="rotate(-10 65 75)" filter="blur(2px)"/>
                        </g>

                        <g class="echo-overlay hidden">
                            <path d="M15 40 Q35 30 50 55 Q40 65 15 50 Z" fill="rgba(168, 85, 247, 0.3)" />
                            <text x="25" y="48" font-size="4" fill="#d8b4fe" font-weight="bold">Bazo</text>
                            <g class="shift-organ" data-shift="translate(8, 8)" data-normal="translate(0, 0)">
                                <ellipse cx="65" cy="75" rx="18" ry="14" fill="rgba(59, 130, 246, 0.3)" transform="rotate(-10 65 75)"/>
                                <text x="58" y="76" font-size="4" fill="#93c5fd" font-weight="bold">Riñón Izq</text>
                            </g>
                            <path d="M10 35 Q25 25 50 40" stroke="rgba(234, 179, 8, 0.6)" stroke-width="3" fill="none"/>
                        </g>
                    </svg>
                </div>

                <div id="echo-periesplenico-trans" class="absolute inset-0 hidden bg-black view-layer">
                    <svg class="svg-content" viewBox="0 0 100 100" preserveAspectRatio="xMidYMid meet">
                        <rect x="2" y="2" width="28" height="6" rx="1" fill="rgba(30,58,138,0.7)"/>
                        <text x="16" y="6.2" font-size="3.5" fill="#bfdbfe" font-weight="bold" text-anchor="middle">DER. PACIENTE</text>
                        <text x="96" y="6" font-size="3" fill="#9ca3af" text-anchor="end">IZQ. PACIENTE</text>

                        <path d="M30 0 L70 0 L100 100 L0 100 Z" fill="#111" />
                        <path d="M20 30 Q50 20 60 45 Q30 60 15 45 Z" fill="#3a3a3a" filter="blur(1px)"/>
                        <circle cx="65" cy="65" r="14" fill="#222" filter="blur(1px)"/>
                        <path d="M40 90 Q55 80 70 90 L80 100 L30 100 Z" fill="#000"/>
                        
                        <g class="echo-overlay hidden">
                            <path d="M20 30 Q50 20 60 45 Q30 60 15 45 Z" fill="rgba(168, 85, 247, 0.3)"/>
                            <text x="30" y="45" font-size="4" fill="#d8b4fe" font-weight="bold">Bazo</text>
                            <circle cx="65" cy="65" r="14" fill="rgba(59, 130, 246, 0.3)"/>
                            <text x="59" y="66" font-size="4" fill="#93c5fd" font-weight="bold">Riñón</text>
                            <path d="M40 90 Q50 85 60 90" stroke="rgba(234, 179, 8, 0.6)" stroke-width="2" fill="none" />
                        </g>
                    </svg>
                </div>

                <!-- ================= VISTAS PÉLVICO ================= -->
                <div id="echo-pelvico-long" class="absolute inset-0 hidden bg-black view-layer">
                    <svg class="svg-content" viewBox="0 0 100 100" preserveAspectRatio="xMidYMid meet">
                        <rect x="2" y="2" width="22" height="6" rx="1" fill="rgba(30,58,138,0.7)"/>
                        <text x="13" y="6.2" font-size="3.5" fill="#bfdbfe" font-weight="bold" text-anchor="middle">CABEZA (Sup.)</text>
                        <text x="96" y="6" font-size="3" fill="#9ca3af" text-anchor="end">PIES (Inf.)</text>

                        <path d="M30 0 L70 0 L100 100 L0 100 Z" fill="#111" />
                        <path d="M20 30 Q50 20 80 40 Q85 70 50 80 Q25 75 20 30 Z" fill="#050505" stroke="#fff" stroke-width="0.5" filter="blur(0.5px)"/>

                        <g class="shift-organ" data-shift="translate(0, 10)" data-normal="translate(0, 0)">
                            <ellipse cx="65" cy="85" rx="15" ry="10" fill="#333" filter="blur(2px)"/>
                        </g>
                        <path class="patho-fluid opacity-0" d="M40 80 Q60 75 75 80 Q70 95 45 90 Z" fill="#000" stroke="#111" stroke-width="1"/>

                        <g class="echo-overlay hidden">
                            <path d="M20 30 Q50 20 80 40 Q85 70 50 80 Q25 75 20 30 Z" fill="rgba(34, 197, 94, 0.2)"/>

                            <g class="shift-organ" data-shift="translate(0, 10)" data-normal="translate(0, 0)">
                                <ellipse cx="65" cy="85" rx="15" ry="10" fill="rgba(234, 88, 12, 0.3)"/>
                                <text x="52" y="87" font-size="3" fill="#fdba74" font-weight="bold">Recto/Útero</text>
                            </g>
                        </g>
                    </svg>
                </div>

                <div id="echo-pelvico-trans" class="absolute inset-0 hidden bg-black view-layer">
                    <svg class="svg-content" viewBox="0 0 100 100" preserveAspectRatio="xMidYMid meet">
                        <rect x="2" y="2" width="28" height="6" rx="1" fill="rgba(30,58,138,0.7)"/>
                        <text x="16" y="6.2" font-size="3.5" fill="#bfdbfe" font-weight="bold" text-anchor="middle">DER. PACIENTE</text>
                        <text x="96" y="6" font-size="3" fill="#9ca3af" text-anchor="end">IZQ. PACIENTE</text>

                        <path d="M30 0 L70 0 L100 100 L0 100 Z" fill="#111" />
                        <rect x="25" y="30" width="50" height="35" rx="15" fill="#050505" stroke="#fff" stroke-width="0.5" filter="blur(0.5px)"/>

                        <path class="patho-fluid opacity-0" d="M25 65 Q50 75 75 65 Q70 85 30 85 Z" fill="#000" />

                        <g class="echo-overlay hidden">
                            <rect x="25" y="30" width="50" height="35" rx="15" fill="rgba(34, 197, 94, 0.2)"/>
                            <text x="40" y="50" font-size="5" fill="#86efac" font-weight="bold">Vejiga</text>
                            <g class="shift-organ" data-shift="translate(0, 12)" data-normal="translate(0, 0)">
                                <ellipse cx="50" cy="75" rx="18" ry="8" fill="rgba(234, 88, 12, 0.3)"/>
                            </g>
                        </g>
                    </svg>
                </div>

            </div>
        </div>

        <!-- PANEL 3: CORRELATO 3D -->
        <div class="bg-gray-800 rounded-lg border border-gray-700 flex flex-col min-h-0 relative overflow-hidden">
            <div class="bg-gray-700 text-center py-1 px-4 flex justify-between items-center z-20 border-b border-gray-600 flex-shrink-0">
                <span class="text-xs font-semibold uppercase text-yellow-400">3. Anatomía 3D</span>
                <button id="align-3d-btn" class="text-[10px] bg-yellow-900/80 hover:bg-yellow-700 text-yellow-100 px-2 py-0.5 rounded border border-yellow-600 transition flex items-center gap-1 shadow">
                    Alinear con Ecógrafo
                </button>
            </div>
            
            <div class="relative flex-1 w-full flex flex-col bg-[#0f172a] min-h-0">
                <!-- Zona gráfica SVG -->
                <div class="relative flex-1 w-full min-h-0 flex items-center justify-center p-2" id="anat-container">
                    
                    <div id="anat-out" class="absolute inset-0 flex items-center justify-center view-layer">
                        <svg class="w-16 h-16 text-gray-700" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="1" d="M21 12a9 9 0 01-9 9m9-9a9 9 0 00-9-9m9 9H3m9 9a9 9 0 01-9-9m9 9c1.657 0 3-4.03 3-9s-1.343-9-3-9m0 18c-1.657 0-3-4.03-3-9s1.343-9 3-9m-9 9a9 9 0 019-9"></path></svg>
                    </div>

                    <!-- === MORISON === -->
                    <div id="anat-morison-long" class="absolute inset-0 hidden p-2 flex items-center justify-center view-layer">
                        <svg class="svg-content font-sans svg-anat-container" viewBox="0 0 100 100" preserveAspectRatio="xMidYMid meet">
                            <text x="50" y="5" font-size="4" fill="#cbd5e1" font-weight="bold" text-anchor="middle">CABEZA (Superior)</text>
                            <text x="50" y="98" font-size="4" fill="#cbd5e1" font-weight="bold" text-anchor="middle">PIES (Inferior)</text>
                            <text x="5" y="50" font-size="4" fill="#64748b" text-anchor="middle" transform="rotate(-90 5 50)">PROFUNDO (Posterior)</text>
                            
                            <path d="M25 15 Q35 50 25 85" fill="none" stroke="#334155" stroke-width="1" stroke-dasharray="2"/>
                            <!-- Órganos -->
                            <ellipse cx="45" cy="65" rx="10" ry="15" fill="#9a3412" opacity="0.9"/>
                            <path d="M40 25 Q65 20 75 50 Q55 60 40 25 Z" fill="#b91c1c" opacity="0.85"/>

                            <!-- Haz de luz corregido que atraviesa EXACTAMENTE el hígado, riñón y diafragma -->

                    <div id="anat-morison-trans" class="absolute inset-0 hidden p-2 flex items-center justify-center view-layer">
                        <svg class="svg-content font-sans svg-anat-container" viewBox="0 0 100 100" preserveAspectRatio="xMidYMid meet">
                            <text x="50" y="5" font-size="4" fill="#cbd5e1" font-weight="bold" text-anchor="middle">ANTERIOR (Ombligo)</text>
                            <text x="50" y="98" font-size="4" fill="#cbd5e1" font-weight="bold" text-anchor="middle">POSTERIOR (Espalda)</text>
                            <text x="5" y="50" font-size="4" fill="#cbd5e1" font-weight="bold" text-anchor="middle" transform="rotate(-90 5 50)">DERECHA DEL PACIENTE</text>
                            <text x="95" y="50" font-size="4" fill="#64748b" text-anchor="middle" transform="rotate(90 95 50)">IZQ. PACIENTE</text>
                            
                            <ellipse cx="50" cy="50" rx="40" ry="35" fill="none" stroke="#334155" stroke-width="1" stroke-dasharray="2"/>
                            
                            <!-- SOMBRA ACÚSTICA ESPINAL -->
                            <path d="M50 75 L95 60 L95 90 Z" fill="rgba(0,0,0,0.6)" />

                            <ellipse cx="32" cy="70" rx="8" ry="10" fill="#9a3412" opacity="0.9" transform="rotate(30 32 70)"/>
                            <path d="M12 50 Q10 20 55 25 Q45 55 25 55 Z" fill="#b91c1c" opacity="0.85"/>
                            
                            <!-- Haz de luz ultra ancho para asegurar que toque la columna en el esquema -->
                            <path d="M10 50 L95 15 L95 95 Z" fill="rgba(74, 222, 128, 0.25)"/>
                            
                            <g transform="translate(10, 50) rotate(90) scale(0.25, 0.25) translate(-25, -50)"><use href="#detailed-probe" /></g>
                        </svg>
                    </div>

                    <!-- === ESPLÉNICO === -->
                    <div id="anat-periesplenico-long" class="absolute inset-0 hidden p-2 flex items-center justify-center view-layer">
                        <svg class="svg-content font-sans svg-anat-container" viewBox="0 0 100 100" preserveAspectRatio="xMidYMid meet">
                            <text x="50" y="5" font-size="4" fill="#cbd5e1" font-weight="bold" text-anchor="middle">CABEZA (Superior)</text>
                            <text x="50" y="98" font-size="4" fill="#cbd5e1" font-weight="bold" text-anchor="middle">PIES (Inferior)</text>
                            <text x="95" y="50" font-size="4" fill="#64748b" text-anchor="middle" transform="rotate(90 95 50)">PROFUNDO (Posterior)</text>
                            
                            <path d="M75 15 Q65 50 75 85" fill="none" stroke="#334155" stroke-width="1" stroke-dasharray="2"/> 
                            <ellipse cx="55" cy="70" rx="10" ry="15" fill="#9a3412" opacity="0.9"/> 
                            <path d="M45 35 Q70 30 75 55 Q55 65 45 35 Z" fill="#6b21a8" opacity="0.85"/> 
                            <path d="M80 20 Q55 10 25 25" stroke="#f8fafc" stroke-width="2" fill="none"/> 
                            
                            <!-- Haz de luz -->
                            <path d="M15 50 L80 15 L80 85 Z" fill="rgba(74, 222, 128, 0.25)"/> 
                            <g transform="translate(15, 50) rotate(90) scale(0.25, 0.25) translate(-25, -50)"><use href="#detailed-probe" /></g>
                        </svg>
                    </div>

                    <div id="anat-periesplenico-trans" class="absolute inset-0 hidden p-2 flex items-center justify-center view-layer">
                        <svg class="svg-content font-sans svg-anat-container" viewBox="0 0 100 100" preserveAspectRatio="xMidYMid meet">
                            <text x="50" y="5" font-size="4" fill="#cbd5e1" font-weight="bold" text-anchor="middle">ANTERIOR (Ombligo)</text>
                            <text x="50" y="98" font-size="4" fill="#cbd5e1" font-weight="bold" text-anchor="middle">POSTERIOR (Espalda)</text>
                            <text x="5" y="50" font-size="4" fill="#64748b" text-anchor="middle" transform="rotate(-90 5 50)">DER. PACIENTE</text>
                            <text x="95" y="50" font-size="4" fill="#cbd5e1" font-weight="bold" text-anchor="middle" transform="rotate(90 95 50)">IZQ. PACIENTE</text>
                            
                            <ellipse cx="50" cy="50" rx="40" ry="35" fill="none" stroke="#334155" stroke-width="1" stroke-dasharray="2"/>
                            
                            <!-- SOMBRA ACÚSTICA ESPINAL -->
                            <path d="M50 75 L5 60 L5 90 Z" fill="rgba(0,0,0,0.6)" />
                            <circle cx="50" cy="75" r="5" fill="#94a3b8"/>
                            
                            <ellipse cx="68" cy="70" rx="8" ry="10" fill="#9a3412" opacity="0.9" transform="rotate(-30 68 70)"/> 
                            <path d="M88 50 Q90 20 45 25 Q55 55 75 55 Z" fill="#6b21a8" opacity="0.85"/> 
                            
                            <!-- Haz de luz que toca la columna -->
                            <path d="M90 50 L5 15 L5 95 Z" fill="rgba(74, 222, 128, 0.25)"/>
                            <g transform="translate(90, 50) rotate(-90) scale(-0.25, 0.25) translate(-25, -50)"><use href="#detailed-probe" /></g>
                        </svg>
                    </div>

                    <!-- === PÉLVICO === -->
                    <div id="anat-pelvico-long" class="absolute inset-0 hidden p-2 flex items-center justify-center view-layer">
                        <svg class="svg-content font-sans svg-anat-container" viewBox="0 0 100 100" preserveAspectRatio="xMidYMid meet">
                            <text x="50" y="5" font-size="4" fill="#cbd5e1" font-weight="bold" text-anchor="middle">SUPERIOR (Ombligo)</text>
                            <text x="50" y="98" font-size="4" fill="#cbd5e1" font-weight="bold" text-anchor="middle">INFERIOR (Pelvis)</text>
                            <text x="5" y="50" font-size="4" fill="#cbd5e1" font-weight="bold" text-anchor="middle" transform="rotate(-90 5 50)">ANTERIOR (Vientre)</text>
                            
                            <path d="M15 15 Q20 50 15 85" fill="none" stroke="#334155" stroke-width="1" stroke-dasharray="2"/>
                            <path d="M50 85 Q65 60 80 50" stroke="#9a3412" stroke-width="6" fill="none" opacity="0.8"/>
                            <circle cx="45" cy="65" r="15" fill="#050505" stroke="#cbd5e1" stroke-width="0.5" opacity="0.9"/>
                            
                            <!-- Haz -->
                            <path d="M15 30 L85 60 L85 100 Z" fill="rgba(74, 222, 128, 0.25)"/> 
                            <g transform="translate(15, 30) rotate(120) scale(0.25, 0.25) translate(-25, -50)"><use href="#detailed-probe" /></g>
                        </svg>
                    </div>

                    <div id="anat-pelvico-trans" class="absolute inset-0 hidden p-2 flex items-center justify-center view-layer">
                        <svg class="svg-content font-sans svg-anat-container" viewBox="0 0 100 100" preserveAspectRatio="xMidYMid meet">
                            <text x="50" y="5" font-size="4" fill="#cbd5e1" font-weight="bold" text-anchor="middle">ANTERIOR (Pubis)</text>
                            <text x="50" y="98" font-size="4" fill="#cbd5e1" font-weight="bold" text-anchor="middle">POSTERIOR (Sacro)</text>
                            <text x="5" y="50" font-size="4" fill="#cbd5e1" font-weight="bold" text-anchor="middle" transform="rotate(-90 5 50)">DERECHA DEL PACIENTE</text>
                            <text x="95" y="50" font-size="4" fill="#64748b" text-anchor="middle" transform="rotate(90 95 50)">IZQ. PACIENTE</text>
                            
                            <ellipse cx="50" cy="50" rx="40" ry="35" fill="none" stroke="#334155" stroke-width="1" stroke-dasharray="2"/>
                            <ellipse cx="50" cy="65" rx="15" ry="8" fill="#9a3412" opacity="0.8"/> 
                            <rect x="30" y="30" width="40" height="20" rx="8" fill="#050505" stroke="#cbd5e1" stroke-width="0.5" opacity="0.9"/>
                            
                            <path d="M50 15 L20 85 L80 85 Z" fill="rgba(74, 222, 128, 0.25)"/>
                            <g transform="translate(50, 15) scale(0.25, -0.25) translate(-25, -50)"><use href="#detailed-probe" /></g>
                        </svg>
                    </div>
                </div>

                <!-- Zona de texto scrollable -->
                <div id="explanation-box" class="bg-gray-900 border-t border-gray-600 text-xs sm:text-sm h-32 sm:h-40 overflow-y-auto p-3 flex-shrink-0 relative">
                    <p class="text-gray-400 text-center mt-6 italic">Arrastra el transductor a una zona en el mapa.</p>
                </div>
            </div>
        </div>
    </main>

    <script>
        const zonesConfig = {
            'morison': { name: 'Hepatorrenal (Morison)', hasCustomView: true },
            'periesplenico': { name: 'Periesplénica (Flanco Izq)', hasCustomView: true },
            'pelvico': { name: 'Pélvica (Suprapúbica)', hasCustomView: true }
        };

        let state = {
            isLongitudinal: true,
            currentZone: 'out',
            protocol: 'efast',
            hasPathology: false,
            guidesVisible: false,
            isAligned3D: false
        };

        const probe = document.getElementById('probe');
        const mapContainer = document.getElementById('map-container');
        const statusText = document.getElementById('orientation-status');
        const explanationBox = document.getElementById('explanation-box');
        const pathologyBtn = document.getElementById('pathology-btn');
        const guidesBtn = document.getElementById('toggle-guides-btn');
        const alignBtn = document.getElementById('align-3d-btn');

        const texts = {
            out: "<p class='text-gray-400 text-center mt-6 text-base'>Arrastra el transductor a una zona iluminada en el mapa.</p>",
            
            morison_long: () => `<p class="text-blue-400 font-bold mb-1 flex justify-between"><span>Morison (Sagital)</span><span class="text-[10px] ${state.hasPathology ? 'text-red-400' : 'text-green-400'} border px-1 rounded">${state.hasPathology ? 'FAST +' : 'NORMAL'}</span></p>
                   <ul class="list-disc pl-4 space-y-1 text-gray-200">
                       <li><b>Transductor vertical.</b> Marca azul hacia la <b>CABEZA</b>.</li>
                       <li>Miras el hígado superficial (arriba en pantalla) y el riñón profundo (abajo). El haz de luz (verde en la anatomía) atraviesa primero uno y luego el otro.</li>
                       ${state.isAligned3D ? '<li class="text-yellow-300 font-bold">Nota 3D: ¡Mira la vista 3D! Al alinear el ecógrafo tumbamos la anatomía.</li>' : ''}
                   </ul>`,
            morison_trans: () => `<p class="text-green-400 font-bold mb-1">Morison (Axial)</p>
                   <ul class="list-disc pl-4 space-y-1 text-gray-200">
                       <li><b>Transductor horizontal.</b> Marca azul a la <b>DERECHA DEL PACIENTE</b>.</li>
                       <li><b>Sombra Acústica:</b> ¡Mira la anatomía 3D! El haz choca con la columna y crea una sombra oscura detrás, exactamente igual a la barra negra que ves abajo en la pantalla del ecógrafo.</li>
                   </ul>`,

            periesplenico_long: () => `<p class="text-blue-400 font-bold mb-1 flex justify-between"><span>Esplénico (Sagital)</span><span class="text-[10px] ${state.hasPathology ? 'text-red-400' : 'text-green-400'} border px-1 rounded">${state.hasPathology ? 'FAST +' : 'NORMAL'}</span></p>
                   <ul class="list-disc pl-4 space-y-1 text-gray-200">
                       <li>Marca azul hacia la <b>CABEZA</b>.</li>
                       <li>Buscas sangre negra entre el Bazo y el Riñón izquierdo.</li>
                   </ul>`,
            periesplenico_trans: () => `<p class="text-green-400 font-bold mb-1">Esplénico (Axial)</p>
                   <ul class="list-disc pl-4 space-y-1 text-gray-200">
                       <li>Marca azul a la <b>DERECHA DEL PACIENTE</b>.</li>
                       <li>Nuevamente, nota la sombra acústica de la columna vertebral.</li>
                   </ul>`,

            pelvico_long: () => `<p class="text-blue-400 font-bold mb-1 flex justify-between"><span>Pélvico (Sagital)</span><span class="text-[10px] ${state.hasPathology ? 'text-red-400' : 'text-green-400'} border px-1 rounded">${state.hasPathology ? 'FAST +' : 'NORMAL'}</span></p>
                   <ul class="list-disc pl-4 space-y-1 text-gray-200">
                       <li>Marca azul hacia la <b>SUPERIOR (Cabeza)</b>.</li>
                       <li>La vejiga negra (líquido) permite que el sonido pase perfecto y se ilumine lo que hay detrás (Refuerzo acústico posterior).</li>
                   </ul>`,
            pelvico_trans: () => `<p class="text-green-400 font-bold mb-1">Pélvico (Axial)</p>
                   <ul class="list-disc pl-4 space-y-1 text-gray-200">
                       <li>Marca azul a la <b>DERECHA DEL PACIENTE</b>.</li>
                       <li>La vejiga se ve más cuadrada al cortarla como si fuera un tubo.</li>
                   </ul>`
        };

        window.setProtocol = function(protocolName) {
            state.protocol = protocolName;
            document.getElementById('btn-efast').classList.toggle('bg-blue-600', protocolName === 'efast');
            document.getElementById('btn-efast').classList.toggle('text-white', protocolName === 'efast');
            document.getElementById('btn-efast').classList.toggle('bg-transparent', protocolName !== 'efast');
            
            document.getElementById('btn-rush').classList.toggle('bg-blue-600', protocolName === 'rush');
            document.getElementById('btn-rush').classList.toggle('text-white', protocolName === 'rush');
            document.getElementById('btn-rush').classList.toggle('bg-transparent', protocolName !== 'rush');
            
            document.querySelectorAll('.hotspot').forEach(el => {
                el.classList.toggle('hidden', !el.classList.contains(`protocol-${protocolName}`));
            });
            checkIntersection(parseFloat(probe.style.left) || 0, parseFloat(probe.style.top) || 0, true);
        }

        guidesBtn.addEventListener('click', () => {
            state.guidesVisible = !state.guidesVisible;
            updateDisplays(); 
            guidesBtn.innerText = state.guidesVisible ? 'Ocultar Guías' : 'Mostrar Guías';
            guidesBtn.classList.toggle('bg-green-700', state.guidesVisible);
            guidesBtn.classList.toggle('bg-gray-700', !state.guidesVisible);
        });

        alignBtn.addEventListener('click', () => {
            state.isAligned3D = !state.isAligned3D;
            updateDisplays();
            alignBtn.innerHTML = state.isAligned3D ? `Restaurar Anatomía` : `Alinear con Ecógrafo`;
            alignBtn.classList.toggle('bg-green-700', state.isAligned3D);
            alignBtn.classList.toggle('bg-yellow-900/80', !state.isAligned3D);
        });

        pathologyBtn.addEventListener('click', () => {
            state.hasPathology = !state.hasPathology;
            if (state.hasPathology) {
                pathologyBtn.classList.replace('bg-red-900/80', 'bg-red-600');
                pathologyBtn.classList.replace('text-red-200', 'text-white');
                pathologyBtn.querySelector('span').innerText = `Quitar Sangrado`;
            } else {
                pathologyBtn.classList.replace('bg-red-600', 'bg-red-900/80');
                pathologyBtn.classList.replace('text-white', 'text-red-200');
                pathologyBtn.querySelector('span').innerText = `Sangrado (FAST +)`;
            }
            updateDisplays();
        });

        function toggleRotation() {
            state.isLongitudinal = !state.isLongitudinal;
            probe.classList.toggle('transversal', !state.isLongitudinal);
            statusText.innerText = state.isLongitudinal ? "HACIA CABEZA" : "HACIA DERECHA";
            statusText.className = state.isLongitudinal ? "font-black text-base text-blue-400" : "font-black text-base text-green-400";
            updateDisplays();
        }

        document.getElementById('rotate-btn').addEventListener('click', toggleRotation);
        document.addEventListener('keydown', (e) => {
            if (e.key.toLowerCase() === 'r' || e.code === 'Space') { e.preventDefault(); toggleRotation(); }
        });

        function updateDisplays() {
            document.querySelectorAll('.view-layer').forEach(el => el.classList.add('hidden'));

            if (state.currentZone === 'out') {
                document.getElementById('echo-noise').classList.remove('hidden');
                document.getElementById('anat-out').classList.remove('hidden');
                explanationBox.innerHTML = texts.out;
                pathologyBtn.classList.add('hidden');
            } else {
                pathologyBtn.classList.remove('hidden');
                const orient = state.isLongitudinal ? 'long' : 'trans';
                const echoId = `echo-${state.currentZone}-${orient}`;
                const anatId = `anat-${state.currentZone}-${orient}`;
                
                const echoView = document.getElementById(echoId);
                const anatView = document.getElementById(anatId);
                
                if(echoView) echoView.classList.remove('hidden');
                if(anatView) anatView.classList.remove('hidden');
                
                explanationBox.innerHTML = texts[`${state.currentZone}_${orient}`]();

                if (echoView) {
                    echoView.querySelectorAll('.patho-fluid').forEach(el => {
                        state.hasPathology ? el.classList.remove('opacity-0') : el.classList.add('opacity-0');
                    });
                    echoView.querySelectorAll('.shift-organ').forEach(el => {
                        el.setAttribute('transform', state.hasPathology ? el.dataset.shift : el.dataset.normal);
                    });
                    echoView.querySelectorAll('.echo-overlay').forEach(el => {
                        state.guidesVisible ? el.classList.remove('hidden') : el.classList.add('hidden');
                    });
                }

                if (anatView) {
                    const svgAnat = anatView.querySelector('.svg-anat-container');
                    if (svgAnat) {
                        svgAnat.classList.toggle('rotate-long', state.isAligned3D && state.isLongitudinal);
                        svgAnat.classList.toggle('rotate-trans', state.isAligned3D && !state.isLongitudinal);
                    }
                }
            }
        }

        let isDragging = false;
        probe.addEventListener('pointerdown', (e) => { isDragging = true; probe.setPointerCapture(e.pointerId); });
        probe.addEventListener('pointermove', (e) => {
            if (!isDragging) return;
            const rect = mapContainer.getBoundingClientRect();
            let x = Math.max(20, Math.min(e.clientX - rect.left, rect.width - 20));
            let y = Math.max(30, Math.min(e.clientY - rect.top, rect.height - 30));
            probe.style.left = x + 'px'; probe.style.top = y + 'px';
            checkIntersection(x, y);
        });
        probe.addEventListener('pointerup', (e) => { isDragging = false; probe.releasePointerCapture(e.pointerId); });

        function checkIntersection(x, y, force = false) {
            const mapRect = mapContainer.getBoundingClientRect();
            let foundZone = 'out';
            document.querySelectorAll('.hotspot').forEach(el => el.classList.remove('active'));
            const activeHotspots = document.querySelectorAll('.hotspot:not(.hidden)');
            
            for (let zone of activeHotspots) {
                const zRect = zone.getBoundingClientRect();
                if (x >= zRect.left - mapRect.left && x <= zRect.right - mapRect.left && 
                    y >= zRect.top - mapRect.top && y <= zRect.bottom - mapRect.top) {
                    foundZone = zone.dataset.zone;
                    zone.classList.add('active');
                    break;
                }
            }

            if (state.currentZone !== foundZone || force) {
                state.currentZone = foundZone;
                updateDisplays();
            }
        }

        setProtocol('efast');
    </script>
</body>
</html>
